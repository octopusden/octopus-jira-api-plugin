name: Sonar

# Pull requests are analysed by the pull_request run; push covers main only,
# so a PR push does not run Sonar twice.
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-sonar.yml@v3.4.1
    with:
      java-version: '8'
      quality-gate-wait: true
    secrets: inherit
